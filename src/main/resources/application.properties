spring.application.name=taskmaster

# =====================================================================
# Values in ${ENV_VAR:default} form read the environment variable first.
# The defaults are for LOCAL DEVELOPMENT ONLY. Set real values through
# environment variables in any shared or deployed environment.
# =====================================================================

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Database Connection =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmaster_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# Flyway creates the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# DEV-ONLY default key (Base64, 512 bits). Always set JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1mb3ItdGFza21hc3Rlci1sb2NhbC1kZXZlbG9wbWVudC0xMjM0NTY3ODkw}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ===== File uploads =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# ===== Generative AI (OpenRouter) =====
# Leave OPENROUTER_API_KEY unset to disable the AI endpoints (they return 503).
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.base-url=https://openrouter.ai/api/v1
app.ai.model=${OPENROUTER_MODEL:openrouter/free}
app.ai.timeout-seconds=60
app.ai.app-name=TaskMaster

# ===== Logging =====
# Set to DEBUG to trace notification delivery
logging.level.com.taskmaster.taskmaster.notification=INFO